<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>考评人员考试 · 自测练习</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --card: #fff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --ok: #059669;
      --bad: #dc2626;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: #0f172a;
      line-height: 1.55;
      padding-bottom: 88px;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 14px 16px 12px;
      box-shadow: 0 2px 12px rgba(37,99,235,.25);
    }
    header h1 { font-size: 17px; font-weight: 600; }
    header p { font-size: 12px; opacity: .9; margin-top: 4px; }
    .progress-wrap {
      background: rgba(255,255,255,.2);
      border-radius: 999px;
      height: 6px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-bar { height: 100%; background: #fff; width: 0%; transition: width .25s; }
    .tabs {
      display: flex; gap: 8px; padding: 10px 12px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
    }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    main { padding: 0 12px 16px; max-width: 720px; margin: 0 auto; }
    .section-title {
      font-size: 14px; font-weight: 600; color: var(--primary);
      margin: 14px 0 8px;
      padding-left: 8px;
      border-left: 3px solid var(--primary);
    }
    .q-card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15,23,42,.04);
    }
    .q-card.answered { border-color: #93c5fd; }
    .q-num { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .q-text { font-size: 15px; margin-bottom: 10px; }
    .opts label {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      transition: background .15s, border-color .15s;
    }
    .opts label:active { background: #f8fafc; }
    .opts input { margin-top: 3px; flex-shrink: 0; accent-color: var(--primary); }
    .opts label.selected { border-color: var(--primary); background: #eff6ff; }
    .judge-btns { display: flex; gap: 10px; }
    .judge-btns button {
      flex: 1; padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 15px;
      cursor: pointer;
    }
    .judge-btns button.selected-true { border-color: var(--ok); background: #ecfdf5; color: var(--ok); }
    .judge-btns button.selected-false { border-color: var(--bad); background: #fef2f2; color: var(--bad); }
    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(8px);
      display: flex; gap: 10px;
      max-width: 720px; margin: 0 auto;
    }
    .footer-bar button {
      flex: 1; padding: 14px;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    #btnSubmit { background: var(--primary); color: #fff; }
    #btnSubmit:disabled { opacity: .5; }
    #btnTop { background: #f1f5f9; color: #334155; flex: 0 0 auto; padding: 14px 16px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .result-hero {
      text-align: center;
      padding: 28px 16px;
      background: var(--card);
      border-radius: 16px;
      margin: 16px 12px;
      border: 1px solid var(--border);
    }
    .score-big { font-size: 48px; font-weight: 700; color: var(--primary); }
    .score-sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
    .breakdown {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-top: 16px; font-size: 12px;
    }
    .breakdown div { background: #f8fafc; padding: 10px 6px; border-radius: 8px; }
    .breakdown strong { display: block; font-size: 18px; color: #0f172a; }
    .wrong-list { padding: 0 12px 24px; max-width: 720px; margin: 0 auto; }
    .wrong-item {
      background: var(--card);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      border-left: 4px solid var(--bad);
      font-size: 13px;
    }
    .wrong-item.ok-item { border-left-color: var(--ok); }
    .wrong-item .ans { color: var(--muted); margin-top: 6px; font-size: 12px; }
    .wrong-item .ans em { color: var(--ok); font-style: normal; font-weight: 600; }
    .wrong-item .ans em.bad { color: var(--bad); }
    #btnRetry {
      display: block; width: calc(100% - 24px); max-width: 696px;
      margin: 0 auto 24px; padding: 14px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    .hint { font-size: 12px; color: var(--muted); padding: 0 12px 8px; text-align: center; }
    .filter-bar { display: flex; gap: 8px; padding: 0 12px 8px; justify-content: center; }
    .filter-bar button {
      padding: 6px 12px; font-size: 12px;
      border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); cursor: pointer;
    }
    .filter-bar button.active { background: #fee2e2; border-color: #fca5a5; color: var(--bad); }
  </style>
</head>
<body>
  <header>
    <h1>技能人才评价 · 考评人员自测</h1>
    <p>单选 60 题 · 多选 5 题 · 判断 20 题 · 满分 100</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </header>

  <div id="screenQuiz" class="screen active">
    <div class="tabs">
      <button type="button" class="tab active" data-scroll="secSingle">单选</button>
      <button type="button" class="tab" data-scroll="secMulti">多选</button>
      <button type="button" class="tab" data-scroll="secJudge">判断</button>
    </div>
    <main id="quizRoot"></main>
    <p class="hint">多选题：少选、多选、错选均不得分</p>
    <div class="footer-bar">
      <button type="button" id="btnTop">顶部</button>
      <button type="button" id="btnSubmit">提交答卷</button>
    </div>
  </div>

  <div id="screenResult" class="screen">
    <div class="result-hero">
      <div class="score-big"><span id="scoreTotal">0</span><span style="font-size:22px">分</span></div>
      <div class="score-sub" id="scoreSummary"></div>
      <div class="breakdown">
        <div><strong id="bSingle">0</strong>单选 /60</div>
        <div><strong id="bMulti">0</strong>多选 /20</div>
        <div><strong id="bJudge">0</strong>判断 /20</div>
      </div>
    </div>
    <div class="filter-bar">
      <button type="button" class="active" id="filterWrong">只看错题</button>
      <button type="button" id="filterAll">全部题目</button>
    </div>
    <div class="wrong-list" id="resultList"></div>
    <button type="button" id="btnRetry">重新答题</button>
  </div>

  <script>

            state.answers[q.id] = val === 'true';
            div.querySelectorAll('button').forEach(b => {
              b.classList.remove('selected-true', 'selected-false');
            });
            btn.classList.add(val === 'true' ? 'selected-true' : 'selected-false');
            card.classList.add('answered');
            updateProgress();
          };
          div.appendChild(btn);
        });
        card.appendChild(div);
      } else {
        const opts = document.createElement('div');
        opts.className = 'opts';
        q.options.forEach((text, i) => {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = type === 'multi' ? 'checkbox' : 'radio';
          input.name = q.id;
          input.value = i;
          input.onchange = () => {
            if (type === 'single') {
              state.answers[q.id] = i;
              opts.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
              label.classList.add('selected');
            } else {
              const checked = [...opts.querySelectorAll('input:checked')].map(el => +el.value);
              state.answers[q.id] = checked.sort((a,b)=>a-b);
              opts.querySelectorAll('label').forEach(l => {
                l.classList.toggle('selected', l.querySelector('input').checked);
              });
            }
            card.classList.add('answered');
            updateProgress();
          };
          label.appendChild(input);
          label.appendChild(document.createTextNode(`${LETTERS[i]}. ${text}`));
          opts.appendChild(label);
        });
        card.appendChild(opts);
      }
      return card;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function totalQuestions() {
      return QUIZ.single.length + QUIZ.multi.length + QUIZ.judge.length;
    }

    function countAnswered() {
      let n = 0;
      QUIZ.single.forEach(q => { if (state.answers[q.id] !== undefined) n++; });
      QUIZ.multi.forEach(q => { if (Array.isArray(state.answers[q.id]) && state.answers[q.id].length) n++; });
      QUIZ.judge.forEach(q => { if (state.answers[q.id] !== undefined) n++; });
      return n;
    }

    function updateProgress() {
      const t = totalQuestions();
      const a = countAnswered();
      document.getElementById('progressBar').style.width = (a / t * 100) + '%';
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }

    function grade() {
      const detail = [];
      let singleScore = 0, multiScore = 0, judgeScore = 0;

      QUIZ.single.forEach(q => {
        const user = state.answers[q.id];
        const ok = user === q.answer;
        if (ok) singleScore++;
        detail.push({ ...q, type: 'single', ok, user, correct: q.answer });
      });

      QUIZ.multi.forEach(q => {
        const user = state.answers[q.id] || [];
        const ok = arraysEqual(user, q.answer);
        if (ok) multiScore += 4;
        detail.push({ ...q, type: 'multi', ok, user, correct: q.answer });
      });

      QUIZ.judge.forEach(q => {
        const user = state.answers[q.id];
        const ok = user === q.answer;
        if (ok) judgeScore++;
        detail.push({ ...q, type: 'judge', ok, user, correct: q.answer });
      });

      return {
        total: singleScore + multiScore + judgeScore,
        singleScore, multiScore, judgeScore,
        detail
      };
    }

    function formatUserAnswer(item) {
      if (item.type === 'judge') {
        if (item.user === undefined) return '未作答';
        return item.user ? '正确' : '错误';
      }
      if (item.type === 'single') {
        if (item.user === undefined) return '未作答';
        return LETTERS[item.user] + '. ' + item.options[item.user];
      }
      const u = item.user || [];
      if (!u.length) return '未作答';
      return u.map(i => LETTERS[i] + '. ' + item.options[i]).join('；');
    }

    function formatCorrect(item) {
      if (item.type === 'judge') return item.correct ? '正确' : '错误';
      if (item.type === 'single') return LETTERS[item.correct] + '. ' + item.options[item.correct];
      return item.correct.map(i => LETTERS[i] + '. ' + item.options[i]).join('；');
    }

    function showResult(onlyWrong) {
      const g = grade();
      document.getElementById('scoreTotal').textContent = g.total;
      document.getElementById('scoreSummary').textContent =
        `答对 ${g.detail.filter(x=>x.ok).length} / ${g.detail.length} 题 · 未答 ${totalQuestions() - countAnswered()} 题`;
      document.getElementById('bSingle').textContent = g.singleScore;
      document.getElementById('bMulti').textContent = g.multiScore;
      document.getElementById('bJudge').textContent = g.judgeScore;

      const list = document.getElementById('resultList');
      list.innerHTML = '';
      g.detail.filter(item => onlyWrong ? !item.ok : true).forEach(item => {
        const el = document.createElement('div');
        el.className = 'wrong-item' + (item.ok ? ' ok-item' : '');
        const typeLabel = item.type === 'single' ? '单选' : item.type === 'multi' ? '多选' : '判断';
        el.innerHTML = `
          <div><strong>${typeLabel} 第${item.num}题</strong> ${item.ok ? '✓ 正确' : '✗ 错误'}</div>
          <div style="margin-top:6px">${escapeHtml(item.q)}</div>
          <div class="ans">你的答案：<em class="${item.ok?'':'bad'}">${escapeHtml(formatUserAnswer(item))}</em></div>
          ${item.ok ? '' : `<div class="ans">参考答案：<em>${escapeHtml(formatCorrect(item))}</em></div>`}
        `;
        list.appendChild(el);
      });

      window.__lastGrade = g;
    }

    function submitQuiz() {
      const unanswered = totalQuestions() - countAnswered();
      if (unanswered > 0) {
        const go = confirm(`还有 ${unanswered} 题未作答，确定提交吗？`);
        if (!go) return;
      }
      state.submitted = true;
      document.getElementById('screenQuiz').classList.remove('active');
      document.getElementById('screenResult').classList.add('active');
      showResult(true);
      window.scrollTo(0, 0);
    }

    function retryQuiz() {
      state.answers = {};
      state.submitted = false;
      document.getElementById('screenResult').classList.remove('active');
      document.getElementById('screenQuiz').classList.add('active');
      renderQuiz();
      updateProgress();
      window.scrollTo(0, 0);
    }

    document.getElementById('btnSubmit').onclick = submitQuiz;
    document.getElementById('btnRetry').onclick = retryQuiz;
    document.getElementById('btnTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const el = document.getElementById(tab.dataset.scroll);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
    document.getElementById('filterWrong').onclick = function() {
      document.getElementById('filterAll').classList.remove('active');
      this.classList.add('active');
      showResult(true);
    };
    document.getElementById('filterAll').onclick = function() {
      document.getElementById('filterWrong').classList.remove('active');
      this.classList.add('active');
      showResult(false);
    };

    try { loadQuiz(); } catch (err) {
      document.getElementById('quizRoot').innerHTML =
        '<p style="padding:20px;color:#dc2626">加载题库失败。</p>';
      console.error(err);
    }
  </script>
</body>
</html>
